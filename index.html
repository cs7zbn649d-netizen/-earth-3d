<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>โครงสร้างโลก 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:Arial,sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;font-size:22px;z-index:5}#load small{display:block;text-align:center;font-size:13px;opacity:.7;margin-top:8px}#title{position:fixed;top:12px;left:12px;z-index:3;font-size:22px;font-weight:bold}#hint{position:fixed;top:43px;left:12px;z-index:3;font-size:12px;opacity:.7}.panel{position:fixed;left:12px;bottom:12px;z-index:3;max-width:calc(100% - 24px);padding:10px;border-radius:15px;background:#070c1edd;backdrop-filter:blur(8px)}button{margin:3px;padding:8px 10px;border:0;border-radius:9px;background:#263052;color:#fff}button.on{background:#5367df}#info{font-size:13px;line-height:1.5;margin:5px 3px 0;max-width:430px}#err{display:none;position:fixed;inset:20px;z-index:10;background:#220d16;border:1px solid #73304a;border-radius:15px;padding:20px;text-align:center}</style></head><body><div id="load">กำลังสร้างโลก 3D...<small>กำลังโหลดระบบ 3 มิติ</small></div><div id="title">🌍 โครงสร้างโลก 3D</div><div id="hint">ลากเพื่อหมุน • เลื่อนเพื่อซูม</div><div class="panel"><button class="on" data-m="all">โลกทั้งหมด</button><button data-m="crust">เปลือกโลก</button><button data-m="mantle">เนื้อโลก</button><button data-m="outer">แก่นโลกชั้นนอก</button><button data-m="inner">แก่นโลกชั้นใน</button><button data-m="cut">ผ่าดูชั้นโลก</button><div id="info"><b>โลกทั้งหมด</b><br>โลกประกอบด้วยเปลือกโลก เนื้อโลก แก่นโลกชั้นนอก และแก่นโลกชั้นใน</div></div><div id="err"></div><script>const load=document.getElementById('load'),err=document.getElementById('err');let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';s.onload=init;s.onerror=()=>{load.style.display='none';err.style.display='block';err.innerHTML='<b>โหลดระบบ 3D ไม่สำเร็จ</b><br><br>ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้าเว็บ';};document.head.appendChild(s);setTimeout(()=>{if(!window.THREE){err.style.display='block';err.innerHTML='<b>โหลดนานเกินไป</b><br><br>ลองรีเฟรชหน้าเว็บ';}},12000);function init(){const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x050816);const cam=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);cam.position.z=5.5;const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);scene.add(new T.AmbientLight(0xffffff,1.5));let dl=new T.DirectionalLight(0xffffff,2.2);dl.position.set(4,3,5);scene.add(dl);let g=new T.Group();scene.add(g);function tex(){let c=document.createElement('canvas');c.width=1024;c.height=512;let x=c.getContext('2d');x.fillStyle='#1760a8';x.fillRect(0,0,1024,512);let a=[[150,145,110,60],[260,220,75,110],[430,145,120,65],[520,245,90,110],[680,145,120,60],[790,250,95,125],[900,150,65,55],[120,340,85,55],[320,365,110,65],[570,375,120,55]];a.forEach((b,i)=>{x.fillStyle=i%2?'#70ad59':'#4b9652';x.beginPath();x.ellipse(...b,0,0,Math.PI*2);x.fill()});return new T.CanvasTexture(c)}let earth=new T.Mesh(new T.SphereGeometry(1.65,64,64),new T.MeshStandardMaterial({map:tex(),roughness:.9}));g.add(earth);g.add(new T.Mesh(new T.SphereGeometry(1.72,64,64),new T.MeshBasicMaterial({color:0x66aaff,transparent:true,opacity:.12,side:T.BackSide})));let L={crust:new T.Mesh(new T.SphereGeometry(1.66,48,48),new T.MeshStandardMaterial({color:0x8b6a42,transparent:true,opacity:.72})),mantle:new T.Mesh(new T.SphereGeometry(1.42,48,48),new T.MeshStandardMaterial({color:0xd56b32,transparent:true,opacity:.76})),outer:new T.Mesh(new T.SphereGeometry(.83,48,48),new T.MeshStandardMaterial({color:0xf0a52f,transparent:true,opacity:.8})),inner:new T.Mesh(new T.SphereGeometry(.47,48,48),new T.MeshStandardMaterial({color:0xffd35a,transparent:true,opacity:.95}))};Object.values(L).forEach(x=>{x.visible=false;g.add(x)});let info={all:['โลกทั้งหมด','โลกประกอบด้วย เปลือกโลก เนื้อโลก แก่นโลกชั้นนอก และแก่นโลกชั้นใน'],crust:['เปลือกโลก','ชั้นนอกสุดของโลก เป็นของแข็ง'],mantle:['เนื้อโลก','อยู่ใต้เปลือกโลก มีอุณหภูมิและความดันสูง'],outer:['แก่นโลกชั้นนอก','มีโลหะเป็นหลักและมีสถานะเป็นของเหลว'],inner:['แก่นโลกชั้นใน','บริเวณใจกลางโลก มีความดันสูงมากและเป็นของแข็ง'],cut:['ผ่าดูชั้นโลก','แสดงชั้นภายในแบบแยกออกเพื่อดูโครงสร้าง']};function mode(m){Object.values(L).forEach(x=>x.visible=false);earth.visible=true;if(m==='crust')L.crust.visible=true;if(m==='mantle'){L.crust.visible=true;L.mantle.visible=true}if(m==='outer'){L.crust.visible=true;L.mantle.visible=true;L.outer.visible=true}if(m==='inner'){L.crust.visible=true;L.mantle.visible=true;L.outer.visible=true;L.inner.visible=true}if(m==='cut'){earth.visible=false;Object.values(L).forEach(x=>x.visible=true)}document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));document.getElementById('info').innerHTML='<b>'+info[m][0]+'</b><br>'+info[m][1]}document.querySelectorAll('button').forEach(b=>b.onclick=()=>mode(b.dataset.m));let down=false,x=0,y=0,rx=0,ry=0,z=5.5;r.domElement.onpointerdown=e=>{down=true;x=e.clientX;y=e.clientY;r.domElement.setPointerCapture(e.pointerId)};r.domElement.onpointermove=e=>{if(!down)return;ry+=(e.clientX-x)*.008;rx+=(e.clientY-y)*.008;rx=Math.max(-1.4,Math.min(1.4,rx));x=e.clientX;y=e.clientY};r.domElement.onpointerup=()=>down=false;r.domElement.onpointercancel=()=>down=false;r.domElement.onwheel=e=>{e.preventDefault();z=Math.max(3.1,Math.min(8,z+e.deltaY*.004))};addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);g.rotation.x=rx;g.rotation.y=ry;cam.position.z=z;cam.lookAt(0,0,0);r.render(scene,cam)}load.style.display='none';loop()}</script></body></html>
